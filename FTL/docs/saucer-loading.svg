<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#75757A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Dome -->
  <path d="M 7.19 7.333 A 5.5 5.5 0 0 1 16.81 7.333" />

  <!-- Rim -->
  <ellipse cx="12" cy="10" rx="10.5" ry="3" />

  <!-- Rim underside panels -->
  <line x1="4.4" y1="10" x2="4.4" y2="12.07" />
  <line x1="8.8" y1="10" x2="8.8" y2="12.86" />
  <line x1="15.2" y1="10" x2="15.2" y2="12.86" />
  <line x1="19.6" y1="10" x2="19.6" y2="12.07" />

  <!-- Beam sides -->
  <line x1="8.8" y1="13.6" x2="2.4" y2="23" />
  <line x1="15.2" y1="13.6" x2="21.6" y2="23" />

  <!-- Animated beam rungs (1.8s loop, climbing upward) -->
  <line stroke="#75757A" stroke-width="1.2">
    <animate attributeName="y1" values="23;13.6" dur="1.8s" repeatCount="indefinite" begin="0s" />
    <animate attributeName="y2" values="23;13.6" dur="1.8s" repeatCount="indefinite" begin="0s" />
    <animate attributeName="x1" values="3.3;9.7" dur="1.8s" repeatCount="indefinite" begin="0s" />
    <animate attributeName="x2" values="20.7;14.3" dur="1.8s" repeatCount="indefinite" begin="0s" />
    <animate attributeName="stroke-opacity" values="0;0.75;0" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite" begin="0s" />
  </line>
  <line stroke="#75757A" stroke-width="1.2">
    <animate attributeName="y1" values="23;13.6" dur="1.8s" repeatCount="indefinite" begin="-0.6s" />
    <animate attributeName="y2" values="23;13.6" dur="1.8s" repeatCount="indefinite" begin="-0.6s" />
    <animate attributeName="x1" values="3.3;9.7" dur="1.8s" repeatCount="indefinite" begin="-0.6s" />
    <animate attributeName="x2" values="20.7;14.3" dur="1.8s" repeatCount="indefinite" begin="-0.6s" />
    <animate attributeName="stroke-opacity" values="0;0.75;0" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite" begin="-0.6s" />
  </line>
  <line stroke="#75757A" stroke-width="1.2">
    <animate attributeName="y1" values="23;13.6" dur="1.8s" repeatCount="indefinite" begin="-1.2s" />
    <animate attributeName="y2" values="23;13.6" dur="1.8s" repeatCount="indefinite" begin="-1.2s" />
    <animate attributeName="x1" values="3.3;9.7" dur="1.8s" repeatCount="indefinite" begin="-1.2s" />
    <animate attributeName="x2" values="20.7;14.3" dur="1.8s" repeatCount="indefinite" begin="-1.2s" />
    <animate attributeName="stroke-opacity" values="0;0.75;0" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite" begin="-1.2s" />
  </line>
</svg>
